name: Compilar app SONORIA FM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleDebug -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Guardar la app (APK)
        uses: actions/upload-artifact@v4
        with:
          name: SONORIA-FM-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar versión (la app se actualiza desde aquí)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SONORIA-FM.apk
          gh release create "v${{ github.run_number }}" SONORIA-FM.apk \
            --title "SONORIA FM v${{ github.run_number }}" \
            --notes "Versión ${{ github.run_number }}" --latest
